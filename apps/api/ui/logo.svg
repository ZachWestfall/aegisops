<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Outer circle -->
  <circle cx="50" cy="50" r="45" stroke="#38bdf8" stroke-width="6" fill="none"/>
  
  <!-- Rotating gear -->
  <g class="gear">
    <circle cx="50" cy="50" r="20" stroke="#0ea5e9" stroke-width="4" fill="none"/>
    <line x1="50" y1="25" x2="50" y2="15" stroke="#0ea5e9" stroke-width="4"/>
    <line x1="50" y1="75" x2="50" y2="85" stroke="#0ea5e9" stroke-width="4"/>
    <line x1="25" y1="50" x2="15" y2="50" stroke="#0ea5e9" stroke-width="4"/>
    <line x1="75" y1="50" x2="85" y2="50" stroke="#0ea5e9" stroke-width="4"/>
  </g>

  <!-- Inner pulse dot -->
  <circle class="pulse" cx="50" cy="50" r="6" fill="#38bdf8"/>

  <style>
    .gear {
      transform-origin: 50% 50%;
      animation: spin 4s linear infinite;
    }
    .pulse {
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes spin {
      from { transform: rotate(0deg); }
      to { transform: rotate(360deg); }
    }
    @keyframes pulse {
      0% { r: 6; opacity: 1; }
      50% { r: 10; opacity: 0.6; }
      100% { r: 6; opacity: 1; }
    }
  </style>
</svg>
